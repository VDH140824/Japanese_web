spring:
  application:
    name: japanese-learning-backend

  datasource:
    url: jdbc:mysql://localhost:3306/japanese_learning?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=utf8
    username: root
    password:123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  security:
    oauth2:
      client:
          registration:
            google:
              client-id: ${GOOGLE_CLIENT_ID:your-google-client-id-here}
              client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret-here}
              scope:
                - email
                - profile

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
